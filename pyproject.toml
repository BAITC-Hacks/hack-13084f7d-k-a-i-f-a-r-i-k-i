[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orgdiff-agent"
version = "0.1.0"
description = "Traceable analysis of organizational restructuring documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.16,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
pipeline = [
    "openai>=1.68,<3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "python-docx>=1.1,<2",
    "PyMuPDF>=1.25,<2",
    "openpyxl>=3.1,<4",
    "pytesseract>=0.3.13,<1",
    "rapidfuzz>=3.12,<4",
    "numpy>=2,<3",
    "diskcache>=5.6,<6",
    "Jinja2>=3.1,<4",
]
ui = ["streamlit>=1.42,<2", "plotly>=6,<7"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pdf2image>=1.17,<2"]

[project.scripts]
orgagent = "orgagent.cli:app"

[tool.setuptools.packages.find]
include = ["orgagent*", "eval*"]

[tool.setuptools.package-data]
orgagent = ["py.typed", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "llm: live LLM integration tests; explicitly opt in with --run-llm",
]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi", "*.ipynb", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]
